<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Review Moderation - Sweeps Review Hub</title>
    
    <!-- Google Analytics GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-J9D9QXHKQ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-J9D9QXHKQ0');
    </script>

    <!-- Tailwind CSS & Supabase JS v2 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-8">
            <h1 class="text-2xl font-bold text-white">Review Moderation Dashboard</h1>
            <button id="logoutBtn" onclick="handleLogout()" class="hidden bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 py-2 px-4 rounded border border-slate-700 transition-colors">
                Log Out
            </button>
        </header>

        <!-- Auth Form (Shown when logged out) -->
        <div id="authSection" class="max-w-md mx-auto bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4">Admin Authentication</h2>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1" for="adminEmail">Admin Email</label>
                    <input type="email" id="adminEmail" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1" for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded text-xs transition-colors">Log In</button>
                <div class="text-right mt-2">
                    <button type="button" onclick="handlePasswordReset()" class="text-[11px] text-blue-400 hover:underline focus:outline-none">Forgot Password?</button>
                </div>
                <p id="authMessage" class="text-xs mt-3 hidden"></p>
            </form>
        </div>  

        <!-- Moderation Queue (Shown when authenticated) -->
        <div id="dashboardSection" class="hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-semibold text-white">Pending Submissions Queue</h2>
                <button onclick="fetchPendingReviews()" class="bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 text-xs py-1.5 px-3 rounded border border-blue-500/30 transition-colors">
                    ↻ Refresh Queue
                </button>
            </div>

            <div id="reviewsContainer" class="space-y-4">
                <p class="text-slate-400 text-xs">Loading queue...</p>
            </div>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
  function showDashboard() {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('dashboardSection').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    fetchPendingReviews();
  }

  function displayAuthMessage(msg, isError) {
    const authMessage = document.getElementById('authMessage');
    if (!msg) {
      authMessage.classList.add('hidden');
      return;
    }
    authMessage.innerText = msg;
    authMessage.className = `text-xs mt-3 block ${isError ? 'text-red-400' : 'text-emerald-400'}`;
  }

  function escapeHtml(str) {
    return (str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
